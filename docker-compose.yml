version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: roadmate_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roadmate_db}
      POSTGRES_USER: ${POSTGRES_USER:-roadmate_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roadmate_secure_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roadmate_user} -d ${POSTGRES_DB:-roadmate_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: roadmate_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roadmate_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 roadmate.asgi:application"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=roadmate.settings.development
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-roadmate-super-secret-key-change-in-production-1234567890}
      - DATABASE_URL=postgis://${POSTGRES_USER:-roadmate_user}:${POSTGRES_PASSWORD:-roadmate_secure_pass}@postgres:5432/${POSTGRES_DB:-roadmate_db}
      - REDIS_URL=redis://redis:6379/1
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,0.0.0.0
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_roadmate_key_123456789}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-roadmate_razorpay_secret_987654321}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-roadmate_whsec_secret_key_112233}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
